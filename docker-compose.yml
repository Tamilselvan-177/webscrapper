version: '3.8'

services:
  backend:
    image: tamilselvan177/jobscraper-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OBSCURA_WS_URL=ws://obscura:9222/devtools/browser
    depends_on:
      - obscura
    restart: always

  obscura:
    image: zenika/alpine-chrome
    command: [ "--no-sandbox", "--headless", "--remote-debugging-address=0.0.0.0", "--remote-debugging-port=9222" ]
    ports:
      - "9222:9222"
    restart: always
    shm_size: '1gb' # Browsers need larger shared memory

  frontend:
    image: tamilselvan177/jobscraper-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    restart: always
