version: '3.8'

services:
  backend:
    image: tamilselvan177/jobscraper-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8080:8000"
    environment:
      - OBSCURA_WS_URL=ws://obscura:9222/devtools/browser
      - ADZUNA_APP_ID=71b0f298
      - ADZUNA_APP_KEY=8f2ce8aef294190f8892004471d453d4
      - REED_API_KEY=01c0076f-09e5-4b02-a6f2-5b3d108a711c
    depends_on:
      - obscura
    restart: always
    shm_size: '1gb'
    ipc: host

  obscura:
    image: zenika/alpine-chrome
    command: [ "--no-sandbox", "--headless", "--remote-debugging-address=0.0.0.0", "--remote-debugging-port=9222" ]
    ports:
      - "9222:9222"
    restart: always
    shm_size: '1gb'

  frontend:
    image: tamilselvan177/jobscraper-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    restart: always
